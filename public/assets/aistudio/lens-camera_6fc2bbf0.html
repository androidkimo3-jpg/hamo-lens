</div>
<div id="nv"><div class="hp"></div><button class="nb" data-n="back" data-i="tri"></button><button class="nb" data-n="home" data-i="cir"></button><button class="nb" data-n="rec" data-i="sq"></button></div>

</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=n=>new Promise(r=>setTimeout(r,n));
const L={en:{app:'Lens',tag:'Capture. Keep. Download.',permT:'Allow access',permD:'Lens needs a couple of permissions to work.',camera:'Camera',camD:'Live preview and taking photos.',stor:'Storage',storD:'Keeps photos in this browser after you close the app.',allow:'Allow',ok:'Allowed',blk:'Blocked',dh:'Camera access is blocked. Open this site’s settings in your browser, allow Camera, then tap Allow again.',noCam:'Couldn’t start the camera.',https:'The camera needs HTTPS or localhost.',cont:'Continue',gallery:'Gallery',settings:'Settings',select:'Select',cancel:'Cancel',empty:'No photos yet',emptyD:'Photos you take appear here.',dl:'Download',share:'Share',del:'Delete',delQ:'Delete {n} photo(s)? This can’t be undone.',saved:'Photo saved',selN:'{n} selected',lang:'Language',look:'Design',ios:'iOS',md:'Material',mode:'Appearance',auto:'Auto',light:'Light',dark:'Dark',qual:'Photo quality',std:'Standard',high:'High',dcam:'Default camera',back:'Back',front:'Front',snd:'Shutter sound',used:'Storage used',clear:'Delete all photos',clearQ:'Delete all photos? This can’t be undone.',about:'About',aboutD:'Lens 1.0 — a camera app that runs in your browser.',shNo:'Sharing isn’t supported here.',f_none:'Original',f_mono:'Mono',f_sepia:'Sepia',f_vivid:'Vivid',f_cool:'Cool',f_warm:'Warm',f_fade:'Fade'},
ar:{app:'عدسة',tag:'صوّر. احفظ. نزّل.',permT:'السماح بالوصول',permD:'عدسة تحتاج بعض الصلاحيات عشان تشتغل.',camera:'الكاميرا',camD:'للمعاينة المباشرة والتقاط الصور.',stor:'التخزين',storD:'يحتفظ بالصور داخل المتصفح بعد إغلاق التطبيق.',allow:'سماح',ok:'مسموح',blk:'محظور',dh:'إذن الكاميرا محظور. افتح إعدادات الموقع في المتصفح، فعّل الكاميرا، ثم اضغط سماح مرة تانية.',noCam:'تعذّر تشغيل الكاميرا.',https:'الكاميرا تحتاج HTTPS أو localhost.',cont:'متابعة',gallery:'المعرض',settings:'الإعدادات',select:'تحديد',cancel:'إلغاء',empty:'لا توجد صور بعد',emptyD:'الصور اللي تلتقطها بتظهر هنا.',dl:'تنزيل',share:'مشاركة',del:'حذف',delQ:'حذف {n} صورة؟ لا يمكن التراجع عن ذلك.',saved:'تم حفظ الصورة',selN:'تم تحديد {n}',lang:'اللغة',look:'التصميم',ios:'iOS',md:'Material',mode:'المظهر',auto:'تلقائي',light:'فاتح',dark:'داكن',qual:'جودة الصورة',std:'عادية',high:'عالية',dcam:'الكاميرا الافتراضية',back:'خلفية',front:'أمامية',snd:'صوت الغالق',used:'المساحة المستخدمة',clear:'حذف كل الصور',clearQ:'حذف كل الصور؟ لا يمكن التراجع عن ذلك.',about:'حول',aboutD:'عدسة 1.0 — تطبيق كاميرا يعمل داخل المتصفح.',shNo:'المشاركة غير مدعومة هنا.',f_none:'أصلية',f_mono:'رمادي',f_sepia:'سيبيا',f_vivid:'زاهي',f_cool:'بارد',f_warm:'دافئ',f_fade:'باهت'}};
const FL={none:'none',mono:'grayscale(1) contrast(1.1)',sepia:'sepia(.8) contrast(1.05)',vivid:'saturate(1.7) contrast(1.1)',cool:'hue-rotate(-12deg) saturate(1.1) brightness(1.03)',warm:'sepia(.3) saturate(1.3) hue-rotate(-8deg)',fade:'contrast(.85) brightness(1.1) saturate(.8)'};
let S={lang:/^ar/.test(navigator.language)?'ar':'en',th:'ios',mode:'auto',q:'std',dc:'environment',snd:1,grid:0,ob:0,flt:'none',tm:0,fl:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('lens')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('lens',JSON.stringify(S))}catch(e){}};
const t=(k,n)=>(L[S.lang][k]||k).replace('{n}',n);
const ic=n=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const icons=r=>r.querySelectorAll('[data-i]').forEach(e=>e.innerHTML=ic(e.dataset.i));
let facing=S.dc,stream,track,cap={},zoom=1,busy=0,cx=0,ac,PH=[],U={},sel=new Set(),sm=false,cv=null,dfn,PM={cam:'prompt',st:'prompt'},cur='splash';
const v=$('#v'),fo=$('#fo');
/* storage */
const db=new Promise((ok,no)=>{const r=indexedDB.open('lens',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const x=d.transaction('p',m),r=f(x.objectStore('p'));x.oncomplete=()=>ok(r.result);x.onerror=()=>no(x.error)})};
const load=async()=>{try{PH=(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.id-a.id)}catch(e){PH=[]}thumb()};
const url=p=>U[p.id]||(U[p.id]=URL.createObjectURL(p.blob));
function thumb(){const e=$('#th');e.innerHTML=PH[0]?`<img src="${url(PH[0])}" alt="">`:'<span data-i="image"></span>';icons(e)}
/* ui */
function apply(){const p=$('#ph'),d=S.mode=='dark'||S.mode=='auto'&&matchMedia('(prefers-color-scheme:dark)').matches;
p.dataset.t=S.th;p.dataset.m=d?'dark':'light';p.dir=S.lang=='ar'?'rtl':'ltr';p.style.setProperty('--d',S.lang=='ar'?-1:1);document.documentElement.lang=S.lang;
$$('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));
$$('.seg').forEach(g=>[...g.children].forEach(b=>b.classList.toggle('on',S[g.dataset.s]==b.dataset.v)));
$$('.sw').forEach(b=>b.classList.toggle('on',!!S[b.dataset.s]));
$('#bf').innerHTML=ic(S.fl?'flash':'flashoff');$('#bf').classList.toggle('on',!!S.fl);
$('#bt').classList.toggle('on',!!S.tm);$('#tl').textContent=S.tm?S.tm+'s':'';
$('#gr').classList.toggle('on',!!S.grid);$('#bg').classList.toggle('on',!!S.grid);
$$('.ch').forEach(c=>c.classList.toggle('on',c.dataset.f==S.flt));v.style.filter=FL[S.flt];
clk();pui();hdr();tabs();if(cur=='set')rset()}
const clk=()=>$('#tm').textContent=new Date().toLocaleTimeString(S.lang=='ar'?'ar-EG':'en-US',{hour:'2-digit',minute:'2-digit',hour12:false});
const O={splash:0,perm:1,cam:2,gal:3,set:4,view:5};
function go(id){if(id==cur)return;const f=O[id]>O[cur],a=$('#s-'+cur),b=$('#s-'+id);
b.style.transition='none';b.classList.toggle('out',!f);void b.offsetWidth;b.style.transition='';
a.classList.remove('on');a.classList.toggle('out',f);b.classList.add('on');
if(id!='gal'&&id!='view'){sm=false;sel.clear()}
cur=id;$('#ph').dataset.sc=id;id=='cam'?startCam():stopCam();
if(id=='gal')renderGal();if(id=='set')rset();tabs();hdr()}
function tabs(){$('#tb').classList.toggle('hide',!(cur=='gal'||cur=='set')||sm);$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.g==cur));$('#ab').classList.toggle('on',sm&&cur=='gal')}
function hdr(){$('#gt').textContent=sm?t('selN',sel.size):t('gallery');$('#sl').textContent=t(sm?'cancel':'select');$('#sl').style.visibility=PH.length?'visible':'hidden';$('#s-gal').classList.toggle('sm',sm)}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
function ask(m,ok,fn){$('#dm').textContent=m;$('#dok').textContent=ok;dfn=fn;$('#dlg').classList.add('on')}
$('#dx').onclick=$('#dlg').onclick=e=>{if(e.target.id=='dlg'||e.target.id=='dx')$('#dlg').classList.remove('on')};
$('#dok').onclick=()=>{$('#dlg').classList.remove('on');dfn&&dfn()};
/* permissions */
function pui(){const m=(s,f)=>s=='granted'?`<em class="ok">${t('ok')}</em>`:(s=='denied'?`<em class="no">${t('blk')}</em> `:'')+`<button class="pill" onclick="${f}()">${t('allow')}</button>`;
$$('.pc').forEach(e=>e.innerHTML=m(PM.cam,'reqCam'));$$('.ps').forEach(e=>e.innerHTML=m(PM.st,'reqSt'));$('#go').disabled=PM.cam!='granted';
$$('.dh').forEach(e=>e.textContent=PM.cam=='denied'?t('dh'):PM.cam=='error'?t(navigator.mediaDevices?'noCam':'https'):'')}
async function reqCam(){try{if(!navigator.mediaDevices)throw{};const s=await navigator.mediaDevices.getUserMedia({video:true});s.getTracks().forEach(k=>k.stop());PM.cam='granted'}catch(e){PM.cam=e.name=='NotAllowedError'?'denied':'error'}pui()}
async function reqSt(){try{PM.st=(await navigator.storage.persist())?'granted':'denied'}catch(e){PM.st='denied'}pui()}
async function chk(){try{const r=await navigator.permissions.query({name:'camera'});PM.cam=r.state;r.onchange=()=>{PM.cam=r.state;pui()}}catch(e){}try{if(await navigator.storage.persisted())PM.st='granted'}catch(e){}pui()}
$('#go').onclick=()=>{S.ob=1;save();go('cam')};
/* camera */
async function startCam(){stopCam();try{if(!navigator.mediaDevices)throw{name:'Insecure'};const q=S.q=='high';
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:q?3840:1920},height:{ideal:q?2160:1080}}});
v.srcObject=stream;track=stream.getVideoTracks()[0];cap=track.getCapabilities?track.getCapabilities():{};v.style.setProperty('--mx',facing=='user'?-1:1);setZ(1);PM.cam='granted';pui()}
catch(e){PM.cam=e.name=='NotAllowedError'?'denied':'error';pui();toast(t(e.name=='Insecure'?'https':'noCam'));go('perm')}}
function stopCam(){stream&&stream.getTracks().forEach(k=>k.stop());stream=null;v.srcObject=null}
function setZ(z){zoom=Math.max(1,Math.min(4,z));v.style.setProperty('--z',zoom);$('#zr').value=zoom;$('#zl').textContent=zoom.toFixed(1)+'x'}
$('#zr').oninput=e=>setZ(+e.target.value);
let pd=0,pz=1;const ds=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
$('#s-cam').addEventListener('touchstart',e=>{if(e.touches.length==2){pd=ds(e);pz=zoom}},{passive:true});
$('#s-cam').addEventListener('touchmove',e=>{if(e.touches.length==2)setZ(pz*ds(e)/pd)},{passive:true});
function click(){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=1100;g.gain.setValueAtTime(.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.08);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.09)}catch(e){}}
async function cdn(n){for(let i=n;i>0;i--){if(cx)return 0;$('#cd').innerHTML=`<span class="pp">${i}</span>`;await sleep(1000)}return !cx}
async function snap(){if(!stream)return;if(busy){cx=1;return}busy=1;cx=0;
try{if(S.tm&&!await cdn(S.tm))return;
const tc=S.fl&&cap.torch&&facing!='user';
if(S.fl){if(tc){await track.applyConstraints({advanced:[{torch:true}]});await sleep(300)}else{fo.className='h';await sleep(250)}}
click();fo.className='';void fo.offsetWidth;fo.className='f';
const w=v.videoWidth,h=v.videoHeight,ea=v.clientWidth/v.clientHeight;let cw=w,ch=h;if(ea<w/h)cw=h*ea;else ch=w/ea;cw/=zoom;ch/=zoom;
const c=document.createElement('canvas');c.width=cw|0;c.height=ch|0;const x=c.getContext('2d');x.filter=FL[S.flt];
if(facing=='user'){x.translate(c.width,0);x.scale(-1,1)}x.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,c.width,c.height);
if(tc)track.applyConstraints({advanced:[{torch:false}]}).catch(()=>{});
const b=await new Promise(r=>c.toBlob(r,'image/jpeg',S.q=='high'?.95:.85));
await tx('readwrite',s=>s.add({id:Date.now(),blob:b}));await load();toast(t('saved'))}
catch(e){toast(t('noCam'))}finally{busy=0;$('#cd').innerHTML=''}}
$('#sh').onclick=snap;
$('#bf').onclick=()=>{S.fl^=1;save();apply()};
$('#bt').onclick=()=>{S.tm=S.tm==0?3:S.tm==3?10:0;save();apply()};
$('#bg').onclick=()=>{S.grid^=1;save();apply()};
$('#bl2').onclick=()=>{$('#fs').classList.toggle('on');$('#bl2').classList.toggle('on')};
$('#bs').onclick=()=>go('set');$('#th').onclick=()=>go('gal');
$('#fp').onclick=()=>{facing=facing=='user'?'environment':'user';$('#fp').classList.toggle('r');startCam()};
$('#fs').innerHTML=Object.keys(FL).map(k=>`<button class="ch cg" data-f="${k}" data-k="f_${k}"></button>`).join('');
$$('.ch').forEach(c=>c.onclick=()=>{S.flt=c.dataset.f;save();apply()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCam();else if(cur=='cam')startCam()});
/* gallery */
function renderGal(){$('#gg').innerHTML=PH.map(p=>`<button class="th${sel.has(p.id)?' s':''}" data-id="${p.id}"><img src="${url(p)}" alt=""><span class="ck">${ic('check')}</span></button>`).join('');$('#em').style.display=PH.length?'none':'flex';hdr()}
$('#gg').onclick=e=>{const b=e.target.closest('.th');if(!b)return;const id=+b.dataset.id;
if(sm){sel.has(id)?sel.delete(id):sel.add(id);b.classList.toggle('s');hdr()}else openV(id)};
$('#sl').onclick=()=>{sm=!sm;sel.clear();renderGal();tabs()};
function openV(id){cv=PH.find(p=>p.id==id);$('#vi').src=url(cv);$('#vd').textContent=new Date(cv.id).toLocaleString(S.lang=='ar'?'ar-EG':'en-US',{dateStyle:'medium',timeStyle:'short'});go('view')}
$('#vc').onclick=()=>go('gal');
const nm=p=>'Lens_'+new Date(p.id).toISOString().replace(/[-:T]/g,'').slice(0,14)+'.jpg';
function dl(p){const a=document.createElement('a');a.href=URL.createObjectURL(p.blob);a.download=nm(p);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
async function share(l){const f=l.map(p=>new File([p.blob],nm(p),{type:'image/jpeg'}));try{if(navigator.canShare&&navigator.canShare({files:f}))await navigator.share({files:f});else toast(t('shNo'))}catch(e){}}
async function act(k,l){if(!l.length)return;
if(k=='dl'){for(const p of l){dl(p);await sleep(450)}}else if(k=='sh')share(l);
else ask(t('delQ',l.length),t('del'),async()=>{for(const p of l){await tx('readwrite',s=>s.delete(p.id));URL.revokeObjectURL(U[p.id]);delete U[p.id]}await load();sel.clear();sm=false;if(cur=='view')go('gal');renderGal();tabs()})}
$$('#vb [data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,[cv]));
$$('#ab [data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,PH.filter(p=>sel.has(p.id))));
$$('.tab').forEach(b=>b.onclick=()=>go(b.dataset.g));
/* settings */
function rset(){$('#us').textContent=(PH.reduce((a,p)=>a+p.blob.size,0)/1048576).toFixed(1)+' MB'}
$('#ca').onclick=()=>PH.length&&ask(t('clearQ'),t('del'),async()=>{await tx('readwrite',s=>s.clear());Object.values(U).forEach(URL.revokeObjectURL);U={};await load();rset();hdr()});
$$('.seg button').forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.s;S[k]=b.dataset.v;if(k=='dc')facing=b.dataset.v;save();apply()});
$$('.sw').forEach(b=>b.onclick=()=>{S[b.dataset.s]^=1;save();apply()});
$$('.nb').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n=='back')go({gal:'cam',set:'cam',view:'gal'}[cur]||cur);else if(n=='home'&&S.ob)go('cam')});
/* init */
function fit(){$('#ph').style.transform=innerWidth>520?`scale(${Math.min(1,(innerHeight-40)/844)})`:''}
addEventListener('resize',fit);setInterval(clk,20000);
icons(document);apply();fit();load();chk();
setTimeout(()=>go(S.ob?'cam':'perm'),2400);
</script></body></html>
